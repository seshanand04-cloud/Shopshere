name: Build ProductService

on:
  push:
    branches:
      - development

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release

      - name: Publish
        run: dotnet publish -c Release -o publish

      - name: Stop IIS
        shell: powershell
        run: iisreset /stop

      - name: Copy Published Files
        shell: powershell
        run: |
          Write-Host "Copying published files..."
          Copy-Item -Path "publish\*" -Destination "C:\inetpub\ProductService" -Recurse -Force

      - name: Start IIS
        shell: powershell
        run: iisreset /start