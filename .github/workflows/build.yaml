name: Build ProductService

on:
  push:
    branches:
      - development
      - main

jobs:
  build:
    runs-on: self-hosted

    steps:

      - name: Set Environment
        shell: powershell
        run: |
          if ("${{ github.ref_name }}" -eq "development") {
            echo "SITE=ProductService-Dev" >> $env:GITHUB_ENV
            echo "POOL=ProductPool-Dev" >> $env:GITHUB_ENV
            echo "DEPLOY_PATH=C:\inetpub\ProductService-Dev" >> $env:GITHUB_ENV
          }
          else {
            echo "SITE=ProductService-Prod" >> $env:GITHUB_ENV
            echo "POOL=ProductPool-Prod" >> $env:GITHUB_ENV
            echo "DEPLOY_PATH=C:\inetpub\ProductService-Prod" >> $env:GITHUB_ENV
          }

      - name: Build Latest Code
        shell: powershell
        run: |
          cd C:\Builder\Shopshere
          git fetch
          git checkout ${{ github.ref_name }}
          git pull

          dotnet restore
          dotnet build --configuration Release
          dotnet publish -c Release -o publish

      - name: Deploy
        shell: powershell
        run: |
          Import-Module WebAdministration

          Stop-Website $env:SITE
          Stop-WebAppPool $env:POOL

          Copy-Item "C:\Builder\Shopshere\publish\*" $env:DEPLOY_PATH -Recurse -Force

          Start-WebAppPool $env:POOL
          Start-Website $env:SITE