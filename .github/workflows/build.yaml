name: ProductService CI/CD

on:
  push:
    branches:
      - development
      - main

jobs:

  development:

    if: github.ref_name == 'development'

    runs-on: self-hosted

    steps:

      - name: Pull Latest Code
        shell: powershell
        run: |
          cd C:\Builder\Shopshere

          git fetch origin
          git checkout development
          git reset --hard origin/development

      - name: Build Application
        shell: powershell
        run: |
          cd C:\Builder\Shopshere

          Remove-Item publish -Recurse -Force -ErrorAction Ignore

          dotnet restore

          dotnet publish -c Release -o publish

      - name: Save Release Artifact
        shell: powershell
        run: |

          Remove-Item `
          "C:\Builder\Release\ProductService" `
          -Recurse -Force `
          -ErrorAction Ignore

          New-Item `
          -ItemType Directory `
          -Path "C:\Builder\Release\ProductService" `
          -Force

          Copy-Item `
          "C:\Builder\Shopshere\publish\*" `
          "C:\Builder\Release\ProductService" `
          -Recurse -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProductService
          path: C:\Builder\Release\ProductService

      - name: Deploy Development
        shell: powershell
        run: |

          Import-Module WebAdministration

          Stop-WebAppPool ProductPool-Dev -ErrorAction Ignore

          Remove-Item `
          "C:\inetpub\ProductService-Dev\*" `
          -Recurse -Force `
          -ErrorAction Ignore

          Copy-Item `
          "C:\Builder\Release\ProductService\*" `
          "C:\inetpub\ProductService-Dev" `
          -Recurse -Force

          Start-WebAppPool ProductPool-Dev

  production:

    if: github.ref_name == 'main'

    runs-on: self-hosted

    environment: Production

    steps:

      - name: Deploy Production
        shell: powershell
        run: |

          Import-Module WebAdministration

          Stop-WebAppPool ProductPool-Prod -ErrorAction Ignore

          Remove-Item `
          "C:\inetpub\ProductService-Prod\*" `
          -Recurse -Force `
          -ErrorAction Ignore

          Copy-Item `
          "C:\Builder\Release\ProductService\*" `
          "C:\inetpub\ProductService-Prod" `
          -Recurse -Force

          Start-WebAppPool ProductPool-Prod