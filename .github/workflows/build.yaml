name: ProductService CI/CD

on:
  push:
    branches:
      - development
      - main

jobs:

  build-dev:

    if: github.ref_name == 'development'

    runs-on: self-hosted

    steps:

      - name: Pull Latest Code
        shell: powershell
        run: |
          cd C:\Builder\Shopshere

          git fetch origin
          git checkout development
          git reset --hard origin/development

      - name: Build Application
        shell: powershell
        run: |
          cd C:\Builder\Shopshere

          Remove-Item publish -Recurse -Force -ErrorAction Ignore

          dotnet restore

          dotnet publish -c Release -o publish

      - name: Create Versioned Artifact
        shell: powershell
        run: |

          New-Item `
            -ItemType Directory `
            -Force `
            -Path C:\Builder\Artifacts\ProductService | Out-Null

          Remove-Item `
            C:\Builder\Artifacts\ProductService\* `
            -Force `
            -ErrorAction Ignore

          $version = Get-Date -Format "yyyyMMdd-HHmmss"

          Compress-Archive `
            -Path C:\Builder\Shopshere\publish\* `
            -DestinationPath "C:\Builder\Artifacts\ProductService\ProductService-$version.zip"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProductService
          path: C:\Builder\Artifacts\ProductService\ProductService-*.zip

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: ProductService
          path: C:\Builder\Temp\ProductService

      - name: Deploy Development
        shell: powershell
        run: |

          Import-Module WebAdministration

          Remove-Item `
            C:\Builder\Temp\ProductService\Extracted `
            -Recurse -Force `
            -ErrorAction Ignore

          $zip = Get-ChildItem `
            C:\Builder\Temp\ProductService\*.zip |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          Expand-Archive `
            $zip.FullName `
            C:\Builder\Temp\ProductService\Extracted `
            -Force

          Stop-WebAppPool ProductPool-Dev -ErrorAction Ignore

          Remove-Item `
            C:\inetpub\ProductService-Dev\* `
            -Recurse -Force `
            -ErrorAction Ignore

          Copy-Item `
            C:\Builder\Temp\ProductService\Extracted\* `
            C:\inetpub\ProductService-Dev `
            -Recurse -Force

          Start-WebAppPool ProductPool-Dev

  deploy-prod:

    if: github.ref_name == 'main'

    runs-on: self-hosted

    environment: Production

    steps:

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: ProductService
          path: C:\Builder\Temp\ProductService

      - name: Deploy Production
        shell: powershell
        run: |

          Import-Module WebAdministration

          Remove-Item `
            C:\Builder\Temp\ProductService\Extracted `
            -Recurse -Force `
            -ErrorAction Ignore

          $zip = Get-ChildItem `
            C:\Builder\Temp\ProductService\*.zip |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          Expand-Archive `
            $zip.FullName `
            C:\Builder\Temp\ProductService\Extracted `
            -Force

          Stop-WebAppPool ProductPool-Prod -ErrorAction Ignore

          Remove-Item `
            C:\inetpub\ProductService-Prod\* `
            -Recurse -Force `
            -ErrorAction Ignore

          Copy-Item `
            C:\Builder\Temp\ProductService\Extracted\* `
            C:\inetpub\ProductService-Prod `
            -Recurse -Force

          Start-WebAppPool ProductPool-Prod