name: Build ProductService

on:
  push:
    branches:
      - development
      - main

jobs:

  build:

    runs-on: self-hosted

    steps:

      - name: Build on Builder Server
        shell: powershell
        run: |

          cd C:\Builder\Shopshere

          Write-Host ""
          Write-Host "===== Pull Latest Source ====="
          Write-Host ""

          git fetch origin
          git checkout ${{ github.ref_name }}
          git reset --hard origin/${{ github.ref_name }}

          if(Test-Path ".\publish")
          {
              Remove-Item ".\publish" -Recurse -Force
          }

          Write-Host ""
          Write-Host "===== Visual Studio Build Started ====="
          Write-Host ""

          dotnet restore

          dotnet build -c Release

          dotnet publish -c Release -o publish

          Write-Host ""
          Write-Host "===== Build Completed ====="

      - name: Upload Artifact

        uses: actions/upload-artifact@v4

        with:

          name: ProductService

          path: C:\Builder\Shopshere\publish