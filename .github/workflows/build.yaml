name: Build ProductService

on:
  push:
    branches:
      - development

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release

      - name: Publish
        run: dotnet publish -c Release -o publish

      - name: Stop Product Application Pool
        run: |
          Import-Module WebAdministration
          Stop-WebAppPool -Name "ProductPool"

      - name: Copy Published Files
        run: |
          Copy-Item -Path "publish\*" -Destination "C:\inetpub\ProductService" -Recurse -Force

      - name: Start Product Application Pool
        run: |
          Import-Module WebAdministration
          Start-WebAppPool -Name "ProductPool"